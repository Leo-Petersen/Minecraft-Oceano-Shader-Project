#  CUSTOM UNIFORMS
uniform.float.PI=3.14159265

#  MINECRAFT OPTIONS
underwaterOverlay=false
oldLighting=false
vignette=false
separateAo=false
dynamicHandLight=true


# DEPTH/ALPHA #
particles.before.deferred=true
# rain.depth=true            # need to revisit
beacon.beam.depth=true
alphaTest.gbuffers_water=GREATER 0.01
alphaTest.gbuffers_weather=GREATER 0.0001
blend.gbuffers_skybasic = off
# Held items, only the colour buffer blends
blend.gbuffers_hand.colortex1 = off
blend.gbuffers_hand.colortex2 = off
blend.gbuffers_hand.colortex8 = off
blend.gbuffers_hand.colortex13 = off


#  SHADOWS / CULLING
frustum.culling=true
shadow.culling=true
shadowDistanceRenderMul=1.0
shadowHardwareFiltering0=true
shadowHardwareFiltering1=true
program.shadow.enabled=shadowMap || VoxelLighting


#  VOXELIZATION
iris.features.required=CUSTOM_IMAGES
voxelizeLightBlocks=true
image.voxel_img=voxelSampler red_integer r8ui unsigned_int true false 128 64 128
image.pom_face_img=pomFaceSampler red_integer r32ui unsigned_int true false 64 32 384
image.floodfill_img=floodfillSampler rgba rgba16f half_float false false 128 64 128
image.floodfill_img_copy=floodfillSamplerCopy rgba rgba16f half_float false false 128 64 128
program.world0/shadowcomp.enabled=true


#  DISTANT HORIZONS
#ifdef DISTANT_HORIZONS
dhShadow.enabled=false
blend.dh_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
#endif


#  SLIDERS
sliders = \
    shadowMapResolution shadowDistance shadowDistortion sunPathRotation \
    lightingQuality lightStr ambientStr filterStr min_skyLightMap sunStrength \
    torchR torchG torchB \
    aoQuality aoRadius aoStrength \
    sssQuality shadowPixelResolution \
    BounceLightStr \
    atmosApDensity caveFogStrength volumetricFogQuality FogAltitude FogStrength cloudFogSamples \
    cloudReflSteps \
    cloudAltitude cloudScale cloudSize cloudThickness cloudCoverage cloudSeparation \
    cloudDensity cloudTopFall cloudBaseFlat \
    cloudBigClouds cloudBigMerge cloudWarp cloudPuff cloudHeightVar cloudHeightFreq cloudHeightBias \
    cloudDetail cloudDetailCell cloudDetailVaspect cloudSwirl \
    cloudSunBrightness cloudAmbient cloudTransitionDim cloudMs cloudPowder \
    cloudWindSpeed cloudEvolve \
    shallowwaterR shallowwaterG shallowwaterB deepwaterR deepwaterG deepwaterB \
    AbsorptionCoeffR AbsorptionCoeffG AbsorptionCoeffB \
    reflectedCausticsStrength WaterDepth \
    parallaxQuality parallaxDepth parallaxNearDist parallaxFarDist \
    parallaxSmoothness parallaxEdgeChamfer \
    parallaxShadowQuality parallaxShadowSoftness \
    emissionStrength pstrength pshininess \
    ssrMaxAlpha reflConeScale reflGroundAlbedo metalDiffuse hcMetalBrightness \
    exposure saturation colorTemperature filmGrain SharpenStr Focal \
    windDirectionX windDirectionY foliageWindSpeed foliageWindWaveLength \
    foliageWindSharpness foliageWindFloor foliageFlutterSpeed foliageFlutterScale \
    heatHazeStrength heatSteps riseDecay riseSpread riseBuoyancy \
    grassHeight distAmbient depthFogStr underFogStr bloomStrength


#  MAIN SCREEN
screen = <empty> <empty> <profile> <empty> <empty> <empty> \
         [LightMap] [Lighting] [Atmosphere] [Reflections] \
         [Materials] [Post] [WavingFoliage] <empty> <empty> <empty> <empty> [misc]


#  LIGHT MAP
screen.LightMap = <empty> <empty> shadowMap shadowMapResolution shadowDistance sunPathRotation \
                  <empty> <empty> torchLightMap [torchColors] skyLightMap
    screen.torchColors = <empty> <empty> torchR <empty> torchG <empty> torchB


#  LIGHTING
screen.Lighting = <empty> <empty> [AO] VoxelLighting [FillLight] [PixelShadows] \
                  SubsurfaceScattering sssQuality <empty> <empty> \
                  lightingQuality lightStr sunStrength min_skyLightMap filterStr ambientStr <empty> distAmbient
    screen.AO = <empty> <empty> AO <empty> <empty> <empty> aoQuality <empty> aoRadius <empty> aoStrength
    screen.FillLight = <empty> <empty> BounceLight <empty> BounceLightStr
    screen.PixelShadows = <empty> <empty> PixelLockedShadows shadowPixelResolution


#  ATMOSPHERE
screen.Atmosphere = <empty> <empty> [VolumetricClouds] [VolumetricLight] <empty> <empty> \
                    atmosphereFog atmosApDensity <empty> <empty> \
                    fogBlur BorderFog caveFog caveFogStrength

    screen.VolumetricLight = <empty> <empty> volumetricLight <empty> <empty> <empty> \
                             volumetricFogQuality FogAltitude FogStrength

    screen.VolumetricClouds = <empty> <empty> VolumetricClouds cloudQuality cloudReflections cloudReflSteps \
                              <empty> <empty> [CloudShape] [CloudMasses] [CloudDetail] [CloudLighting] [CloudWeather]

        screen.CloudShape = <empty> <empty> cloudAltitude cloudScale cloudSize cloudThickness \
                            <empty> <empty> cloudCoverage cloudSeparation cloudDensity cloudTopFall <empty> cloudBaseFlat
        screen.CloudMasses = <empty> <empty> cloudBigClouds cloudBigMerge cloudWarp cloudPuff \
                             <empty> <empty> cloudHeightVar cloudHeightFreq cloudHeightBias
        screen.CloudDetail = <empty> <empty> cloudDetail cloudDetailCell cloudDetailVaspect cloudSwirl
        screen.CloudLighting = <empty> <empty> cloudSunBrightness cloudAmbient cloudTransitionDim cloudMs cloudPowder
        screen.CloudWeather = <empty> <empty> cloudWindSpeed cloudEvolve


#  REFLECTIONS / WATER
screen.Reflections = <empty> <empty> [WaterColors] rainReflection <empty> <empty> ParallaxWater WaterDepth <empty> <empty> \
                     Caustics reflectedCaustics reflectedCausticsStrength <empty> <empty> <empty> \
                     depthFogStr underFogStr


#  WATER COLOURS
screen.WaterColors = <empty> <empty> shallowwaterR deepwaterR shallowwaterG deepwaterG shallowwaterB deepwaterB \
                     <empty> <empty> AbsorptionCoeffR <empty> AbsorptionCoeffG <empty> AbsorptionCoeffB


#  MATERIALS
screen.Materials = <empty> <empty> Parallax [ParallaxSettings] <empty> <empty> \
                   materialReflections hardcodedMetals <empty> [MaterialReflections] <empty> <empty> \
                   CookTorranceGGXBRDF [Specular] \
                   materialEmission emissionStrength

    screen.MaterialReflections = <empty> <empty> hcMetalBrightness metalDiffuse <empty> <empty> \
                                 ssrMaxAlpha reflConeScale reflGroundAlbedo

    screen.Specular = <empty> <empty> pstrength pshininess

    screen.ParallaxSettings = <empty> <empty> parallaxDepth parallaxQuality parallaxSmoothness parallaxEdgeChamfer \
                              parallaxNearDist parallaxFarDist <empty> <empty> \
                              ParallaxSlopeNormals ParallaxAO ParallaxTranslucents ParallaxSeams \
                              ParallaxShadow [ShadowSettings]
        screen.ShadowSettings = <empty> <empty> parallaxShadowQuality parallaxShadowSoftness


#  POST PROCESSING
screen.Post = <empty> <empty> [ToneMap] TAA <empty> <empty> \
              DOF Focal bloom bloomStrength purkinjeShift screenSunGlare

    screen.ToneMap = <empty> <empty> ToneMap exposure <empty> <empty> \
                     tonemapSaturation saturation FilmGrain filmGrain \
                     colorTemp colorTemperature


#  WAVING FOLIAGE
screen.WavingFoliage = <empty> <empty> wavingFoliage <empty> <empty> <empty> \
                       windDirectionX windDirectionY foliageWindSpeed foliageWindWaveLength \
                       <empty> <empty> foliageWindSharpness foliageWindFloor foliageFlutterSpeed foliageFlutterScale


#  MISC
screen.misc = <empty> <empty> whiteWorld alwaysPuddles grassHeight overworldHeatHaze [Nether]
    screen.Nether = <empty> <empty> netherHeatHaze <empty> <empty> <empty> \
                    heatHazeStrength heatSteps riseDecay riseSpread riseBuoyancy


#  QUALITY PROFILES
profile.VeryLow = !netherHeatHaze aoQuality=2 cloudFogSamples=3 !Caustics !reflectedCaustics !AO !fogBlur shadowMapResolution=1536 lightingQuality=2 filterStr=0.40 BounceLight volumetricFogQuality=3 !ParallaxWater !bloom screenSunGlare !VolumetricClouds cloudQuality=1 !cloudReflections
profile.Low     = !netherHeatHaze aoQuality=2 cloudFogSamples=3 !Caustics !reflectedCaustics !AO !fogBlur shadowMapResolution=1536 lightingQuality=2 filterStr=0.40 BounceLight volumetricFogQuality=3 !ParallaxWater !bloom screenSunGlare VolumetricClouds cloudQuality=2 !cloudReflections
profile.Default = netherHeatHaze aoQuality=2 cloudFogSamples=6 Caustics reflectedCaustics AO fogBlur shadowMapResolution=2048 lightingQuality=2 filterStr=0.30 BounceLight volumetricFogQuality=8 ParallaxWater bloom !screenSunGlare VolumetricClouds cloudQuality=2 cloudReflections cloudReflSteps=2
profile.High    = netherHeatHaze aoQuality=4 cloudFogSamples=8 Caustics reflectedCaustics AO fogBlur shadowMapResolution=4096 lightingQuality=4 filterStr=0.25 BounceLight volumetricFogQuality=8 ParallaxWater bloom !screenSunGlare VolumetricClouds cloudQuality=3 cloudReflections cloudReflSteps=4
