# Photonics
photonics.enabled=PHOTONICS_ENABLED
photonics.lightingMode=restir
photonics.restirCombinedGi=false
photonics.restirSoftShadows=true
photonics.enableHandheldLight=true

# Custom Uniforms
uniform.float.PI=3.14159265

# Minecraft Options
underwaterOverlay=false
oldLighting=false
vignette=false

particles.before.deferred = true
dynamicHandLight=true
separateAo=true
frustum.culling=true
shadow.culling=true
shadowDistanceRenderMul=1.0
program.shadow.enabled=shadowMap

alphaTest.gbuffers_water=GREATER 0.01
alphaTest.gbuffers_weather=GREATER 0.0001
beacon.beam.depth=true

texture.gbuffers.colortex10=lib/skyboxes.png

# Voxel Settings
iris.features.required=CUSTOM_IMAGES
voxelizeLightBlocks=true
image.voxel_img=voxelSampler red_integer r8ui unsigned_int true false 128 64 128
image.floodfill_img=floodfillSampler rgba rgba16f half_float false false 128 64 128
image.floodfill_img_copy=floodfillSamplerCopy rgba rgba16f half_float false false 128 64 128
program.world0/shadowcomp.enabled=true

shadowHardwareFiltering0 = true
shadowHardwareFiltering1 = true

# Sliders
sliders= SSS_Quality reflectedCausticsStrength caveFogStrength emissionStrength parallaxNearDist aoQuality aoStrength exposure parallaxQuality parallaxShadowDepth CLOUD_FOG_SAMPLES AbsorptionCoeffR AbsorptionCoeffG AbsorptionCoeffB deepwaterR deepwaterG deepwaterB shallowwaterR shallowwaterG shallowwaterB shadowDistortion CLOUD_FOG_DENSITY CLOUD_FOG_HEIGHT CLOUD_FOG_THICKNESS CLOUD_FOG_SPEED CLOUD_FOG_COVERAGE CLOUD_FOG_START CLOUD_FOG_END CLOUD_FOG_FADE_NEAR CLOUD_FOG_FADE_FAR CLOUD_FOG_MIN_BRIGHTNESS CLOUD_FOG_MIN_TRANSMIT CLOUD_FOG_SAMPLES shadowDistance PBRReflectionStr parallaxDepth parallaxFarDist parallaxShadowQuality parallaxShadowStrength Focal torchR torchG torchB bounceQuality aoRadius grassHeight lightingQuality colorTemperature LUTstrength filmGrain saturation SharpenStr FogStrength FogAltitude shadowMapResolution sunPathRotation filterStr min_skyLightMap lightStr ambientStr BounceAmbient BounceLightStr SunlightContribution BounceLightContribution pstrength pshininess volumetricFogQuality

# Main screen
screen= <empty> <empty> <profile> <empty> <empty> <empty> [LightMap] [Lighting] [Fog] [Post] [Materials] [Reflections] [WaterColors] wavingFoliage <empty> <empty> [Mods] [misc]
# Sub-screen
screen.LightMap= <empty> <empty> shadowMapResolution sunPathRotation torchLightMap [torchColors] skyLightMap
	screen.torchColors = <empty> <empty> torchR <empty> torchG <empty> torchB

screen.Lighting= <empty> <empty> [AO] VoxelLighting [FillLight] SubsurfaceScattering <empty> SSS_Quality <empty> <empty> shadowDistance lightingQuality lightStr min_skyLightMap filterStr ambientStr
	screen.AO = <empty> <empty> AO <empty> <empty> <empty> aoQuality <empty> aoRadius <empty> aoStrength
	screen.FillLight= <empty> <empty> BounceLight BounceColoredLight bounceQuality BounceLightStr

screen.Fog= <empty> <empty> Fog atmosphereFog volumetricCloudFog [CloudFogSettings] fogBlur rainfogBlur BorderFog <empty> <empty> <empty> volumetricLight volumetricFogQuality FogAltitude FogStrength caveFog caveFogStrength
	screen.CloudFogSettings= <empty> <empty> CLOUD_FOG_DENSITY CLOUD_FOG_HEIGHT CLOUD_FOG_THICKNESS CLOUD_FOG_SPEED CLOUD_FOG_COVERAGE CLOUD_FOG_START CLOUD_FOG_END CLOUD_FOG_FADE_NEAR CLOUD_FOG_FADE_FAR CLOUD_FOG_MIN_BRIGHTNESS CLOUD_FOG_MIN_TRANSMIT CLOUD_FOG_SAMPLES

screen.Post= <empty> <empty> <empty> <empty> [ToneMap] TAA [Depth_of_Field] BLOOM PURKINJE_SHIFT screenSunGlare
	screen.ToneMap= <empty> <empty> ToneMap exposure <empty> <empty> tonemapSaturation saturation FilmGrain filmGrain colorTemp colorTemperature inverseKaris
	screen.Depth_of_Field= <empty> <empty> DOF Focal

screen.Materials= <empty> <empty> CookTorranceGGXBRDF materialReflections <empty> <empty> Parallax parallaxTAA parallaxQuality parallaxDepth parallaxFarDist <empty> ParallaxShadow [ShadowSettings] <empty> <empty> materialEmission emissionStrength
	screen.ShadowSettings= <empty> <empty> parallaxShadowQuality parallaxShadowDepth parallaxShadowStrength

screen.Reflections = <empty> <empty> ParallaxWater <empty> <empty> <empty> Caustics <empty> reflectedCaustics reflectedCausticsStrength <empty> <empty> rainReflection
screen.WaterColors= <empty> <empty> shallowwaterR deepwaterR shallowwaterG deepwaterG shallowwaterB deepwaterB <empty> <empty> AbsorptionCoeffR <empty> AbsorptionCoeffG <empty> AbsorptionCoeffB

screen.misc= <empty> <empty> grassHeight whiteWorld fakecloudshadow defaultClouds alwaysPuddles

screen.Mods= <empty> <empty> PHOTONICS_ENABLED

# Profiles

profile.Low= aoQuality=2 CLOUD_FOG_SAMPLES=3 bounceQuality=2 !Caustics !reflectedCaustics !AO !fogBlur shadowMapResolution=1536 lightingQuality=2 filterStr=0.40 BounceLight !BounceColoredLight volumetricFogQuality=3 volumetricFog !ParallaxWater !BLOOM screenSunGlare
profile.Default= aoQuality=2 CLOUD_FOG_SAMPLES=6 bounceQuality=2 Caustics reflectedCaustics AO fogBlur shadowMapResolution=1536 lightingQuality=2 filterStr=0.30 BounceLight BounceColoredLight volumetricFogQuality=4 volumetricFog ParallaxWater BLOOM !screenSunGlare
profile.High= aoQuality=2 CLOUD_FOG_SAMPLES=6 bounceQuality=4 Caustics reflectedCaustics AO fogBlur shadowMapResolution=2048 lightingQuality=2 filterStr=0.30 BounceLight BounceColoredLight volumetricFogQuality=8 volumetricFog ParallaxWater BLOOM !screenSunGlare
profile.Ultra= aoQuality=4 CLOUD_FOG_SAMPLES=8 bounceQuality=4 Caustics reflectedCaustics AO fogBlur shadowMapResolution=4096 lightingQuality=4 filterStr=0.15 BounceLight BounceColoredLight volumetricFogQuality=8 volumetricFog ParallaxWater BLOOM !screenSunGlare